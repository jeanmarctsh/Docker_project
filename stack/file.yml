version: "3.8"

services:

  mongodb: 
    image: mongo:8.2
    ports:
      - "27017:27017"
    secrets:
      - mongo_username
      - mongo_pwd
    deploy:
      mode: replicated
      replicas: 2

    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_pwd
    
    networks:
      - swarm_network

    volumes:
      - db:/data/db

    
  mongo_express:
    image: mongo-express:1.0.2-20-alpine3.19
    ports:
      - "8080:8081"
    secrets:
      - mongo_username
      - mongo_pwd
    deploy:
      mode: replicated
      replicas: 2
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME_FILE: /run/secrets/mongo_username
      ME_CONFIG_MONGODB_ADMINPASSWORD_FILE: /run/secrets/mongo_pwd
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      "mongodb"
    
    networks:
      - swarm_network
    


secrets:
  mongo_username:
    external: true
  mongo_pwd:
    external: true




volumes:
  db:
    driver: local
    

networks:
  swarm_network:
    driver: overlay
